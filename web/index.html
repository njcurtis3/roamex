<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roamex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Palette and type follow the Atlas design language: khaki paper, ink,
   one monospace face, 1.5px borders with 2px hard shadows. Tokens live on
   :root, are redefined under prefers-color-scheme: dark (guarded so an
   explicit light choice still wins), and again under [data-theme="dark"]. */
:root {
  --paper:  #E6DFBE;
  --ink:    #17170F;
  --muted:  #6E6B54;
  --rule:   #B9B293;
  --face:   #EFE9CC;
  --grid:   #CFC8A3;
  --accent: #7A4A2B;   /* llm-origin marker; reads as ink-adjacent on khaki */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:  #1E1D15;
    --ink:    #E6DFBE;
    --muted:  #9A9679;
    --rule:   #4A4834;
    --face:   #2A2820;
    --grid:   #34321F;
    --accent: #C79A6B;
  }
}
:root[data-theme="dark"] {
  --paper:  #1E1D15;
  --ink:    #E6DFBE;
  --muted:  #9A9679;
  --rule:   #4A4834;
  --face:   #2A2820;
  --grid:   #34321F;
  --accent: #C79A6B;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 13px/1.5 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  display: flex; flex-direction: column;
  overflow: hidden;
}
mark { background: var(--ink); color: var(--paper); padding: 0 3px; }
code {
  background: var(--face); border: 1px solid var(--rule);
  padding: 0 3px; font-size: 12px; word-break: break-all;
}
button {
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  padding: 3px 9px; cursor: pointer;
}
button:hover { background: var(--face); }
button:active { box-shadow: 0 0 0 var(--ink); transform: translate(2px, 2px); }
button[disabled] { opacity: .4; cursor: default; box-shadow: 2px 2px 0 var(--rule); border-color: var(--rule); }
button.primary { background: var(--ink); color: var(--paper); }
button.primary:hover { opacity: .85; background: var(--ink); }
input, select {
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--ink); padding: 3px 6px; min-width: 0;
}
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* -- top strip -------------------------------------------------------- */
#top {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 12px; border-bottom: 1.5px solid var(--ink); background: var(--face);
}
#top h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .06em; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.stats b { color: var(--ink); font-weight: 600; }
.spacer { flex: 1 1 auto; }

/* -- three-column body ------------------------------------------------ */
#body { flex: 1 1 auto; display: flex; min-height: 0; }
#index {
  width: 240px; flex: 0 0 240px; border-right: 1.5px solid var(--ink);
  display: flex; flex-direction: column; min-height: 0; background: var(--paper);
}
#panel {
  width: 380px; flex: 0 0 380px; border-left: 1.5px solid var(--ink);
  display: flex; flex-direction: column; min-height: 0;
}
#canvasWrap { flex: 1 1 auto; position: relative; min-width: 0; overflow: hidden; }
svg { display: block; width: 100%; height: 100%; cursor: grab; }
svg.dragging { cursor: grabbing; }

.section-head {
  padding: 6px 10px; border-bottom: 1px solid var(--rule);
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.scroll { overflow-y: auto; flex: 1 1 auto; }

/* index rows */
.row {
  display: flex; align-items: baseline; gap: 8px; width: 100%;
  padding: 4px 10px; border: 0; box-shadow: none; background: none;
  border-bottom: 1px solid var(--rule); text-align: left; cursor: pointer;
}
.row:hover { background: var(--face); }
.row[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.row[aria-selected="true"] .row-meta { color: var(--paper); opacity: .75; }
.row-code {
  flex: 0 0 auto; font-size: 10px; border: 1px solid currentColor;
  padding: 0 3px; text-transform: uppercase;
}
.row-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
/* Folder header: a shade heavier than its contents, so the fold is legible
   without adding a second border weight to the index. */
.row.group { background: var(--face); font-weight: 500; }
.row.group:hover { background: var(--grid); }
.row.nested { padding-left: 22px; }
.row.nested .row-name { color: var(--muted); }
.row.nested[aria-selected="true"] .row-name { color: var(--paper); }

/* right panel */
.tabs { display: flex; border-bottom: 1.5px solid var(--ink); }
.tab {
  flex: 1 1 0; border: 0; box-shadow: none; background: var(--paper);
  border-right: 1px solid var(--rule); padding: 6px 4px; font-size: 11px;
  text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
}
.tab:last-child { border-right: 0; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.pane { padding: 10px 12px; }
.pane h2 { font-size: 13px; margin: 0 0 2px; }
.pane .eyebrow { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.pane p { margin: 6px 0; }
.chip {
  display: inline-block; border: 1px solid var(--ink); padding: 0 5px;
  font-size: 11px; margin: 0 4px 4px 0;
}
.chip.on { background: var(--ink); color: var(--paper); }
.chip.dashed { border-style: dashed; color: var(--muted); border-color: var(--muted); }
.edge {
  border-bottom: 1px solid var(--rule); padding: 6px 0; font-size: 12px;
}
.edge .pred { color: var(--muted); }
.edge .src { color: var(--muted); font-size: 11px; display: block; margin-top: 2px; }
.edge button.jump {
  border: 0; box-shadow: none; background: none; padding: 0;
  text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
}
blockquote {
  margin: 4px 0; padding: 4px 8px; border-left: 2px solid var(--rule);
  color: var(--muted); font-style: italic;
}

/* ask */
#askForm { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
#askForm input { flex: 1 1 auto; }
.answer { white-space: pre-wrap; }
.warn { color: var(--accent); }

/* hint bar */
#hint {
  border-top: 1.5px solid var(--ink); background: var(--face);
  padding: 5px 12px; font-size: 11px; color: var(--muted);
  display: flex; gap: 14px; flex-wrap: wrap;
}
kbd {
  border: 1px solid var(--rule); background: var(--paper);
  padding: 0 4px; font: inherit; font-size: 10px;
}
.empty { padding: 20px 12px; color: var(--muted); }

@media (max-width: 900px) {
  #index { display: none; }
  #panel { flex-basis: 300px; width: 300px; }
}
</style>
</head>
<body>

<div id="top">
  <h1>roamex</h1>
  <div class="stats" id="stats"><span>loading…</span></div>
  <span class="spacer"></span>
  <label style="font-size:11px;color:var(--muted)">
    origin
    <select id="originFilter">
      <option value="all">all</option>
      <option value="llm">llm only</option>
      <option value="roam-link">roam links only</option>
    </select>
  </label>
  <button id="refit">Refit</button>
  <button id="themeBtn" title="Toggle theme">◐</button>
</div>

<div id="body">
  <div id="index">
    <div class="section-head">
      <span>Index</span>
      <input id="search" placeholder="filter…" style="flex:1 1 auto;font-size:11px;padding:1px 4px">
    </div>
    <div class="scroll" id="indexList"></div>
  </div>

  <div id="canvasWrap">
    <svg id="canvas"><g id="viewport"></g></svg>
  </div>

  <div id="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="detail" aria-selected="true">Detail</button>
      <button class="tab" role="tab" data-tab="ask" aria-selected="false">Ask</button>
      <button class="tab" role="tab" data-tab="about" aria-selected="false">About</button>
    </div>
    <div class="scroll" id="paneDetail"><div class="empty">Loading graph…</div></div>
    <div class="scroll" id="paneAsk" hidden>
      <form id="askForm">
        <input id="question" placeholder="ask your graph…" maxlength="500" autocomplete="off">
        <button class="primary" type="submit" id="askBtn">Ask</button>
      </form>
      <div class="pane" id="askResult">
        <p style="color:var(--muted)">Answers are built only from triples in this graph, and
        every claim cites the block it came from. <mark>Costs a model call.</mark></p>
      </div>
    </div>
    <div class="scroll" id="paneAbout" hidden><div class="pane" id="aboutBody"></div></div>
  </div>
</div>

<div id="hint">
  <span><kbd>drag</kbd> pan</span>
  <span><kbd>wheel</kbd> zoom</span>
  <span><kbd>click</kbd> a node to pin</span>
  <span><kbd>esc</kbd> deselect</span>
  <span><kbd>/</kbd> filter</span>
  <span id="hintExtra"></span>
</div>

<script>
"use strict";

const SVGNS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);

// Two-letter code per entity type for the index chip and the node badge —
// the Atlas grammar's "code chip + readable short name".
const CODE = {
  page: "PG", person: "PR", concept: "CO", org: "OR", project: "PJ",
  place: "PL", event: "EV", tool: "TL", source: "SR",
};

// What each code means, for the legend and the hover tooltip. `page` is the
// only type that isn't a model judgment — those come straight from Roam's own
// page titles. `concept` is also extract.py's fallback for any type outside
// the allowed vocabulary, so it absorbs extraction misses; the tooltip says so
// rather than letting the count read as pure signal.
const TYPE_NOTE = {
  page:    "A real page in your Roam graph. Read from the export, not inferred.",
  person:  "A person the model found named in your prose.",
  concept: "An idea or term. Also the fallback when the model returns a type outside the allowed list, so this bucket absorbs misses.",
  org:     "An organisation or company.",
  project: "A named piece of work.",
  place:   "A location, physical or virtual.",
  event:   "Something that happened, or happens.",
  tool:    "Software, a service, or an instrument.",
  source:  "A book, paper, article, or other cited work.",
};
const TYPE_ORDER = ["page", "concept", "person", "event", "source", "place", "tool", "org", "project"];

function codeTitle(type) {
  return `${CODE[type] || "??"} — ${type}\n${TYPE_NOTE[type] || "Unknown type."}`;
}

let DATA = null;          // {counts, nodes, edges}
let VIEW = { x: 0, y: 0, k: 1 };
let selectedId = null;
let originFilter = "all";
let searchTerm = "";
let layout = new Map();   // id -> {x, y}

/* ---------- isometric projection -------------------------------------
   Atlas's grammar: P(gx,gy,z) = [(gx-gy)*36, (gx+gy)*18 - z] on a 72x36
   tile. Nodes are placed on a grid ordered by degree so the busiest
   entities land near the origin, then projected onto that lattice —
   the same visual plane as an Atlas map, carrying a knowledge graph
   instead of a system architecture. */
const TILE_W = 36, TILE_H = 18;
// Below this zoom, structure labels are dropped — at a whole-graph fit they
// would overlap into noise, and drawing thousands of them is the single
// most expensive thing in a render.
const LABEL_ZOOM = 0.55;
function project(gx, gy, z = 0) {
  return [(gx - gy) * TILE_W, (gx + gy) * TILE_H - z];
}

function computeLayout(nodes) {
  // Spiral outward from the centre so high-degree nodes sit in the middle
  // and the map reads densest-first, like an atlas's principal structures.
  const sorted = [...nodes].sort((a, b) => b.degree - a.degree || a.name.localeCompare(b.name));
  const map = new Map();
  let gx = 0, gy = 0, dx = 1, dy = 0, seg = 1, step = 0, turns = 0;
  for (const n of sorted) {
    map.set(n.id, { gx, gy });
    gx += dx; gy += dy; step++;
    if (step === seg) { step = 0; [dx, dy] = [-dy, dx]; turns++; if (turns % 2 === 0) seg++; }
  }
  return map;
}

/* ---------- rendering ------------------------------------------------- */

function visibleSets() {
  const edges = DATA.edges.filter(e => originFilter === "all" || e.origin === originFilter);
  const keep = new Set();
  edges.forEach(e => { keep.add(e.source); keep.add(e.target); });
  // With a filter on, isolated nodes would be meaningless dots; with no
  // filter, keep everything so a 0-degree node is still findable.
  const nodes = originFilter === "all" ? DATA.nodes : DATA.nodes.filter(n => keep.has(n.id));
  return { nodes, edges };
}

function render() {
  const vp = $("viewport");
  vp.replaceChildren();
  const { nodes, edges } = visibleSets();
  const byId = new Map(nodes.map(n => [n.id, n]));

  // Edges first (painter's order: ground plane under structures).
  const gEdges = document.createElementNS(SVGNS, "g");
  for (const e of edges) {
    const a = layout.get(e.source), b = layout.get(e.target);
    if (!a || !b || !byId.has(e.source) || !byId.has(e.target)) continue;
    const [x1, y1] = project(a.gx, a.gy), [x2, y2] = project(b.gx, b.gy);
    // One bend, Atlas-style: route via an intermediate ground point.
    const [bx, by] = project(b.gx, a.gy);
    const p = document.createElementNS(SVGNS, "polyline");
    p.setAttribute("points", `${x1},${y1} ${bx},${by} ${x2},${y2}`);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", e.origin === "llm" ? "var(--accent)" : "var(--grid)");
    p.setAttribute("stroke-width", e.origin === "llm" ? "1.4" : "1");
    if (e.origin === "llm") p.setAttribute("stroke-dasharray", "4 3");
    const touching = selectedId && (e.source === selectedId || e.target === selectedId);
    p.setAttribute("opacity", selectedId ? (touching ? "1" : "0.15") : "0.75");
    gEdges.appendChild(p);
  }
  vp.appendChild(gEdges);

  // Structures, sorted by gx+gy for painter's order.
  const drawable = nodes
    .filter(n => layout.has(n.id))
    .sort((a, b) => {
      const A = layout.get(a.id), B = layout.get(b.id);
      return (A.gx + A.gy) - (B.gx + B.gy);
    });

  for (const n of drawable) {
    const { gx, gy } = layout.get(n.id);
    const g = document.createElementNS(SVGNS, "g");
    g.setAttribute("transform", `translate(${project(gx, gy)[0]},${project(gx, gy)[1]})`);
    g.style.cursor = "pointer";
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    g.setAttribute("aria-label", `${n.type}: ${n.name}, ${n.degree} connections`);
    // SVG tooltips are a <title> child, not a title attribute.
    const tip = document.createElementNS(SVGNS, "title");
    tip.textContent =
      `${n.name}\n${codeTitle(n.type)}\n${n.degree} connection${n.degree === 1 ? "" : "s"}` +
      `\n${n.origins.includes("roam-link") ? "Written as a link in Roam" : "Inferred by a model from prose"}`;
    g.appendChild(tip);

    const isSel = n.id === selectedId;
    const dim = selectedId && !isSel && !isNeighbour(n.id);
    g.setAttribute("opacity", dim ? "0.25" : "1");

    // Height encodes degree — the busiest entities literally stand tallest.
    const h = Math.min(34, 6 + n.degree * 1.6);
    const w = 15;
    const top = `0,${-h} ${w},${-h + TILE_H / 2} 0,${-h + TILE_H} ${-w},${-h + TILE_H / 2}`;
    const face = document.createElementNS(SVGNS, "polygon");
    face.setAttribute("points", top);
    face.setAttribute("fill", isSel ? "var(--ink)" : "var(--face)");
    face.setAttribute("stroke", "var(--ink)");
    face.setAttribute("stroke-width", "1.2");
    // A node with only roam-link provenance is structure the author wrote
    // by hand; llm-only is inferred. Dashed = inferred, matching Atlas's
    // "ghost / not built" convention for things that aren't load-bearing.
    if (n.origins.length === 1 && n.origins[0] === "llm") face.setAttribute("stroke-dasharray", "3 2");

    const left = document.createElementNS(SVGNS, "polygon");
    left.setAttribute("points", `${-w},${-h + TILE_H / 2} 0,${-h + TILE_H} 0,${TILE_H} ${-w},${TILE_H / 2}`);
    left.setAttribute("fill", "var(--paper)");
    left.setAttribute("stroke", "var(--ink)");
    left.setAttribute("stroke-width", "1.2");

    const right = document.createElementNS(SVGNS, "polygon");
    right.setAttribute("points", `${w},${-h + TILE_H / 2} 0,${-h + TILE_H} 0,${TILE_H} ${w},${TILE_H / 2}`);
    right.setAttribute("fill", "var(--grid)");
    right.setAttribute("stroke", "var(--ink)");
    right.setAttribute("stroke-width", "1.2");

    g.append(left, right, face);

    // Readable label on a paper tag under the front corner (Atlas grammar).
    if (VIEW.k > LABEL_ZOOM || isSel) {
      const short = n.name.length > 16 ? n.name.slice(0, 15) + "…" : n.name;
      const tag = document.createElementNS(SVGNS, "text");
      tag.setAttribute("x", "0");
      tag.setAttribute("y", String(TILE_H + 11));
      tag.setAttribute("text-anchor", "middle");
      tag.setAttribute("font-size", "9");
      tag.setAttribute("font-family", "IBM Plex Mono, monospace");
      tag.setAttribute("fill", "var(--ink)");
      tag.setAttribute("paint-order", "stroke");
      tag.setAttribute("stroke", "var(--paper)");
      tag.setAttribute("stroke-width", "3");
      tag.textContent = short.toUpperCase();
      g.appendChild(tag);
    }

    g.addEventListener("click", (ev) => {
      ev.stopPropagation();
      // stopPropagation means the svg handler won't run to clear this, so
      // the flag has to be consumed here too.
      if (consumeSuppressedClick()) return;
      select(n.id);
    });
    g.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id); }
    });
    vp.appendChild(g);
  }

  applyTransform();
}

let neighbourCache = { id: null, set: new Set() };
function isNeighbour(id) {
  if (neighbourCache.id !== selectedId) {
    const s = new Set();
    if (selectedId) {
      for (const e of DATA.edges) {
        if (e.source === selectedId) s.add(e.target);
        if (e.target === selectedId) s.add(e.source);
      }
    }
    neighbourCache = { id: selectedId, set: s };
  }
  return neighbourCache.set.has(id);
}

function applyTransform() {
  $("viewport").setAttribute("transform", `translate(${VIEW.x},${VIEW.y}) scale(${VIEW.k})`);
}

function refit() {
  const { nodes } = visibleSets();
  const pts = nodes.filter(n => layout.has(n.id)).map(n => {
    const { gx, gy } = layout.get(n.id);
    return project(gx, gy);
  });
  const rect = $("canvasWrap").getBoundingClientRect();
  if (!pts.length) { VIEW = { x: rect.width / 2, y: rect.height / 2, k: 1 }; return applyTransform(); }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs) - 60, maxX = Math.max(...xs) + 60;
  const minY = Math.min(...ys) - 60, maxY = Math.max(...ys) + 60;
  const k = Math.min(rect.width / (maxX - minX), rect.height / (maxY - minY), 1.6);
  VIEW.k = Math.max(0.05, k);
  VIEW.x = rect.width / 2 - ((minX + maxX) / 2) * VIEW.k;
  VIEW.y = rect.height / 2 - ((minY + maxY) / 2) * VIEW.k;
  applyTransform();
}

/* ---------- index ------------------------------------------------------ */

const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
// Roam's default daily-note title, anchored so it matches ONLY a whole title.
// Deliberately strict: a loose "contains a month name" test would sweep in
// real pages like "Dad's letter on January 7th 2022" and "Day 1: June 19",
// burying them in a folder nobody thinks to open.
const DAILY_RE = new RegExp(`^(${MONTHS.join("|")}) \\d{1,2}(st|nd|rd|th), \\d{4}$`);

function isDailyNote(n) {
  return n.type === "page" && DAILY_RE.test(n.name);
}

/** Sort key for a daily note: the date it names, newest first. Alphabetical
 *  would be meaningless here — it puts April before January. */
function dailyKey(name) {
  const m = name.match(/^(\w+) (\d{1,2})\w\w, (\d{4})$/);
  if (!m) return 0;
  return Number(m[3]) * 10000 + (MONTHS.indexOf(m[1]) + 1) * 100 + Number(m[2]);
}

const INDEX_CAP = 500;
let dailyOpen = false;

function makeRow(n) {
  const b = document.createElement("button");
  b.className = "row";
  b.setAttribute("aria-selected", String(n.id === selectedId));
  b.innerHTML = `<span class="row-code"></span>
    <span class="row-name"></span>
    <span class="row-meta"></span>`;
  const code = b.querySelector(".row-code");
  code.textContent = CODE[n.type] || "??";
  code.title = codeTitle(n.type);
  b.querySelector(".row-name").textContent = n.name;
  const meta = b.querySelector(".row-meta");
  meta.textContent = String(n.degree);
  meta.title = `${n.degree} connection${n.degree === 1 ? "" : "s"}`;
  b.addEventListener("click", () => select(n.id, true));
  return b;
}

function capNote(shown, total) {
  const d = document.createElement("div");
  d.className = "empty";
  d.style.padding = "6px 10px";
  d.textContent = `showing ${shown} of ${total} — use the filter to narrow`;
  return d;
}

function renderIndex() {
  const list = $("indexList");
  list.replaceChildren();
  const { nodes } = visibleSets();
  const term = searchTerm.toLowerCase();
  const matches = nodes.filter(
    n => !term || n.name.toLowerCase().includes(term) || n.type.includes(term)
  );

  const daily = matches.filter(isDailyNote)
    .sort((a, b) => dailyKey(b.name) - dailyKey(a.name));
  const rest = matches.filter(n => !isDailyNote(n))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));

  if (!matches.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "nothing matches.";
    list.appendChild(d);
    return;
  }

  // Daily notes fold into one group. They're 37% of a real graph's pages and
  // dilute the index without saying much on their own.
  if (daily.length) {
    // A filter that matches inside the folder should open it, or the results
    // look like they simply aren't there.
    const open = dailyOpen || (term && daily.length > 0);
    const head = document.createElement("button");
    head.className = "row group";
    head.setAttribute("aria-expanded", String(!!open));
    head.innerHTML = `<span class="row-code">DN</span>
      <span class="row-name"></span>
      <span class="row-meta"></span>`;
    head.querySelector(".row-code").title =
      "DN — daily note\nA Roam daily page, titled with its date. Folded here because they're numerous and say little individually.";
    head.querySelector(".row-name").textContent = `${open ? "▾" : "▸"} Daily Notes`;
    head.querySelector(".row-meta").textContent = String(daily.length);
    head.title = `${daily.length} daily notes — click to ${open ? "collapse" : "expand"}`;
    head.addEventListener("click", () => { dailyOpen = !open; renderIndex(); });
    list.appendChild(head);

    if (open) {
      for (const n of daily.slice(0, INDEX_CAP)) {
        const row = makeRow(n);
        row.classList.add("nested");
        list.appendChild(row);
      }
      if (daily.length > INDEX_CAP) list.appendChild(capNote(INDEX_CAP, daily.length));
    }
  }

  for (const n of rest.slice(0, INDEX_CAP)) list.appendChild(makeRow(n));
  if (rest.length > INDEX_CAP) list.appendChild(capNote(INDEX_CAP, rest.length));
}

/* ---------- detail panel ----------------------------------------------- */

async function select(id, centre = false) {
  selectedId = id;
  renderIndex();
  render();
  if (centre && layout.has(id)) {
    const { gx, gy } = layout.get(id);
    const [x, y] = project(gx, gy);
    const rect = $("canvasWrap").getBoundingClientRect();
    VIEW.k = Math.max(VIEW.k, 0.8);
    VIEW.x = rect.width / 2 - x * VIEW.k;
    VIEW.y = rect.height / 2 - y * VIEW.k;
    applyTransform();
  }
  showTab("detail");
  const pane = $("paneDetail");
  pane.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const r = await fetch(`/api/node/${encodeURIComponent(id)}`);
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    renderDetail(await r.json());
  } catch (err) {
    pane.innerHTML = `<div class="pane warn">Could not load node: ${escapeHtml(String(err))}</div>`;
  }
}

function renderDetail(n) {
  const pane = $("paneDetail");
  const el = document.createElement("div");
  el.className = "pane";

  const origins = [...new Set(n.provenance.map(p => p.origin))];
  const head = document.createElement("div");
  head.innerHTML = `<div class="eyebrow" title="${escapeHtml(codeTitle(n.type))}">${CODE[n.type] || "??"} · ${escapeHtml(n.type)} · pinned</div>`;
  const h2 = document.createElement("h2");
  h2.textContent = n.name;
  head.appendChild(h2);
  el.appendChild(head);

  const chips = document.createElement("div");
  chips.style.margin = "6px 0";
  for (const o of origins) {
    const c = document.createElement("span");
    c.className = "chip" + (o === "llm" ? " dashed" : " on");
    c.textContent = o === "llm" ? "inferred by model" : "written as a link";
    chips.appendChild(c);
  }
  if (n.aliases.length) {
    const c = document.createElement("span");
    c.className = "chip";
    c.textContent = `also: ${n.aliases.join(", ")}`;
    chips.appendChild(c);
  }
  el.appendChild(chips);

  if (n.description) {
    const p = document.createElement("p");
    p.textContent = n.description;
    el.appendChild(p);
  }

  const outs = n.edges.filter(e => e.direction === "out");
  const ins = n.edges.filter(e => e.direction === "in");
  el.appendChild(edgeSection(`Says (${outs.length})`, outs));
  el.appendChild(edgeSection(`Referred to by (${ins.length})`, ins));

  const src = document.createElement("details");
  src.innerHTML = `<summary>Source blocks (${n.provenance.length})</summary>`;
  for (const p of n.provenance.slice(0, 40)) {
    const d = document.createElement("div");
    d.className = "edge";
    d.innerHTML = `<span class="src">page <b>${escapeHtml(p.page_title)}</b> · block <code>${escapeHtml(p.block_uid)}</code>${p.model ? " · " + escapeHtml(p.model) : ""}</span>`;
    if (p.quote) {
      const q = document.createElement("blockquote");
      q.textContent = p.quote;
      d.appendChild(q);
    }
    src.appendChild(d);
  }
  el.appendChild(src);

  pane.replaceChildren(el);
}

function edgeSection(title, edges) {
  const wrap = document.createElement("details");
  if (edges.length) wrap.open = true;
  wrap.innerHTML = `<summary>${escapeHtml(title)}</summary>`;
  if (!edges.length) {
    const p = document.createElement("p");
    p.style.color = "var(--muted)";
    p.textContent = "none";
    wrap.appendChild(p);
    return wrap;
  }
  for (const e of edges.slice(0, 80)) {
    const d = document.createElement("div");
    d.className = "edge";
    const line = document.createElement("div");
    const pred = document.createElement("span");
    pred.className = "pred";
    pred.textContent = ` —${e.predicate}→ `;
    const jump = document.createElement("button");
    jump.className = "jump";
    jump.textContent = e.other_name;
    jump.addEventListener("click", () => select(e.other_id, true));
    line.append(pred, jump);
    d.appendChild(line);
    const src = document.createElement("span");
    src.className = "src";
    src.innerHTML = `${e.origin === "llm" ? "inferred" : "link"} · page <b>${escapeHtml(e.page_title)}</b> · <code>${escapeHtml(e.block_uid)}</code>`;
    d.appendChild(src);
    if (e.quote) {
      const q = document.createElement("blockquote");
      q.textContent = e.quote;
      d.appendChild(q);
    }
    wrap.appendChild(d);
  }
  return wrap;
}

/* ---------- ask -------------------------------------------------------- */

$("askForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = $("question").value.trim();
  if (!q) return;
  const out = $("askResult");
  $("askBtn").disabled = true;
  out.innerHTML = `<p style="color:var(--muted)">Asking… <mark>this calls a model</mark></p>`;
  try {
    const r = await fetch("/api/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, hops: 2 }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    renderAnswer(data);
  } catch (err) {
    out.innerHTML = `<p class="warn">${escapeHtml(String(err))}</p>`;
  } finally {
    $("askBtn").disabled = false;
  }
});

function renderAnswer(a) {
  const out = $("askResult");
  out.replaceChildren();

  const ans = document.createElement("p");
  ans.className = "answer";
  ans.textContent = a.answer;
  out.appendChild(ans);

  const meta = document.createElement("div");
  meta.style.margin = "8px 0";
  const suff = document.createElement("span");
  suff.className = "chip" + (a.sufficient ? " on" : " dashed");
  // The honest-gap case is a feature, not a failure — label it that way.
  suff.textContent = a.sufficient ? "graph had enough" : "graph did not have enough";
  meta.appendChild(suff);
  const shown = document.createElement("span");
  shown.className = "chip";
  shown.textContent = `${a.triples_shown} triples shown`;
  meta.appendChild(shown);
  out.appendChild(meta);

  if (a.invalid_citations && a.invalid_citations.length) {
    const w = document.createElement("p");
    w.className = "warn";
    w.textContent = `Model cited ${a.invalid_citations.length} edge(s) it was never shown — treat this answer with suspicion.`;
    out.appendChild(w);
  }

  const h = document.createElement("div");
  h.className = "eyebrow";
  h.style.marginTop = "10px";
  h.textContent = `Citations (${a.citations.length})`;
  out.appendChild(h);

  for (const c of a.citations) {
    const d = document.createElement("div");
    d.className = "edge";
    d.textContent = `${c.source} —${c.predicate}→ ${c.target}`;
    const s = document.createElement("span");
    s.className = "src";
    s.innerHTML = `page <b>${escapeHtml(c.page_title)}</b> · <code>${escapeHtml(c.block_uid)}</code>`;
    d.appendChild(s);
    if (c.quote) {
      const q = document.createElement("blockquote");
      q.textContent = c.quote;
      d.appendChild(q);
    }
    out.appendChild(d);
  }
  if (!a.citations.length) {
    const p = document.createElement("p");
    p.style.color = "var(--muted)";
    p.textContent = "No citations returned.";
    out.appendChild(p);
  }
}

/* ---------- tabs, theme, pan/zoom -------------------------------------- */

function showTab(name) {
  for (const t of document.querySelectorAll(".tab")) {
    t.setAttribute("aria-selected", String(t.dataset.tab === name));
  }
  $("paneDetail").hidden = name !== "detail";
  $("paneAsk").hidden = name !== "ask";
  $("paneAbout").hidden = name !== "about";
  if (name === "ask") $("question").focus();
}
document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => showTab(t.dataset.tab)));

$("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("roamex-theme", next); } catch (e) { /* private mode */ }
});
try {
  const saved = localStorage.getItem("roamex-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch (e) { /* ignore */ }

$("refit").addEventListener("click", refit);
$("originFilter").addEventListener("change", (e) => {
  originFilter = e.target.value;
  renderIndex(); render();
});
$("search").addEventListener("input", (e) => { searchTerm = e.target.value; renderIndex(); });

const svg = $("canvas");
let drag = null;
const DRAG_THRESHOLD = 4;   // px of movement before a press counts as a pan
// Set when a pan ends, consumed by whichever click handler fires next.
let suppressClick = false;
function consumeSuppressedClick() {
  if (!suppressClick) return false;
  suppressClick = false;
  return true;
}
svg.addEventListener("pointerdown", (e) => {
  // Deliberately NOT capturing the pointer here. setPointerCapture()
  // retargets the compatibility `click` event to the capturing element, so
  // capturing on pointerdown sends every click to the <svg> instead of the
  // structure that was actually clicked — which made every node unclickable.
  // Capture is taken below, only once a real drag starts.
  drag = { x: e.clientX, y: e.clientY, vx: VIEW.x, vy: VIEW.y, moved: false };
});
svg.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  // A few pixels of jitter between press and release is a click, not a drag.
  if (!drag.moved && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
  if (!drag.moved) {
    drag.moved = true;
    svg.classList.add("dragging");
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
  }
  VIEW.x = drag.vx + dx;
  VIEW.y = drag.vy + dy;
  applyTransform();
});
svg.addEventListener("pointerup", (e) => {
  // A drag ends with a click event too; swallow that one so releasing a pan
  // over empty space doesn't deselect, or over a structure doesn't select.
  if (drag && drag.moved) suppressClick = true;
  drag = null;
  svg.classList.remove("dragging");
  try { svg.releasePointerCapture(e.pointerId); } catch (err) { /* never captured */ }
});
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const k = Math.max(0.05, Math.min(4, VIEW.k * factor));
  // Zoom about the cursor, not the origin.
  VIEW.x = mx - (mx - VIEW.x) * (k / VIEW.k);
  VIEW.y = my - (my - VIEW.y) * (k / VIEW.k);
  const crossedLabelThreshold =
    (VIEW.k > LABEL_ZOOM) !== (k > LABEL_ZOOM);
  VIEW.k = k;
  applyTransform();
  // A full render rebuilds every structure in the scene — thousands of SVG
  // nodes on a real graph. The transform alone handles the zoom; the only
  // thing that actually changes with k is whether labels are drawn, so
  // re-render only when that flips.
  if (crossedLabelThreshold) render();
}, { passive: false });
svg.addEventListener("click", () => {
  if (consumeSuppressedClick()) return;
  if (selectedId) { selectedId = null; renderIndex(); render(); renderEmptyDetail(); }
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.key === "Escape" && selectedId) { selectedId = null; renderIndex(); render(); renderEmptyDetail(); }
  if (e.key === "/") { e.preventDefault(); $("search").focus(); }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderEmptyDetail() {
  const c = DATA ? DATA.counts : {};
  $("paneDetail").innerHTML = `
    <div class="pane">
      <div class="eyebrow">The graph</div>
      <h2>Nothing pinned</h2>
      <p>This is your Roam graph as <mark>entities and the relations between them</mark> —
      the links you wrote by hand, plus the ones a model found in your prose and could
      quote a block for.</p>
      <p style="color:var(--muted)">Solid outline = you wrote it as a link.
      Dashed = inferred from prose. Height = how connected an entity is.</p>
      <p>Click any structure to read what it says and where each claim came from,
      or use <b>Ask</b> to question the whole graph.</p>
    </div>`;
}

function renderAbout() {
  const c = DATA.counts || {};
  const body = $("aboutBody");
  body.replaceChildren();

  // Counts come from the loaded graph, not a hardcoded list, so the legend
  // can't drift from what's actually on the map.
  const byType = {};
  for (const n of DATA.nodes) byType[n.type] = (byType[n.type] || 0) + 1;
  const types = [...new Set([...TYPE_ORDER, ...Object.keys(byType)])].filter(t => byType[t]);

  const legendRows = types.map(t => `
    <tr title="${escapeHtml(TYPE_NOTE[t] || "Unknown type.")}">
      <td style="padding:2px 8px 2px 0;vertical-align:top">
        <span class="row-code" style="border-color:var(--ink)">${CODE[t] || "??"}</span>
      </td>
      <td style="padding:2px 8px 2px 0;vertical-align:top"><b>${escapeHtml(t)}</b></td>
      <td style="padding:2px 0;text-align:right;vertical-align:top;color:var(--muted)">${byType[t]}</td>
    </tr>
    <tr><td></td><td colspan="2" style="padding:0 0 6px;color:var(--muted);font-size:11px">
      ${escapeHtml(TYPE_NOTE[t] || "Unknown type.")}
    </td></tr>`).join("");

  body.innerHTML = `
    <div class="eyebrow">Legend</div>
    <h2>Entity types</h2>
    <p style="color:var(--muted)">The code before each name in the index. Hover any chip to see
    the same note.</p>
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px">${legendRows}</table>

    <div class="eyebrow">Reading the map</div>
    <p><b>Height</b> is how connected an entity is — the busiest stand tallest and sit nearest
    the centre. <b>A solid outline</b> means <mark>you wrote that link by hand</mark> in Roam.
    <b>Dashed</b> means a model inferred it from your prose and could quote a block for it.
    Edges follow the same rule.</p>

    <div class="eyebrow">About this view</div>
    <h2>Read-only</h2>
    <p>Served from <code>work/graph.db</code> on <code>127.0.0.1</code>. Nothing here writes
    to your Roam graph, and nothing is authenticated — <mark>do not bind it wider</mark>.</p>
    <p><b>${c.nodes ?? 0}</b> nodes · <b>${c.edges ?? 0}</b> edges ·
    <b>${c.llm_edges ?? 0}</b> inferred by a model · <b>${c.provenance ?? 0}</b> provenance records.</p>
    <p style="color:var(--muted)">Every edge carries the block uid it came from. If a claim
    here looks wrong, the block it cites is the thing to go read.</p>
    <p style="color:var(--muted)">Rebuild the graph with
    <code>python -m src.cli assemble</code>, then reload this page.</p>`;
}

/* ---------- boot -------------------------------------------------------- */

(async function boot() {
  try {
    const r = await fetch("/api/graph");
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    DATA = data;
  } catch (err) {
    $("paneDetail").innerHTML = `<div class="pane warn">Could not load the graph: ${escapeHtml(String(err))}</div>`;
    $("stats").textContent = "no graph";
    return;
  }

  const c = DATA.counts || {};
  $("stats").innerHTML =
    `<span><b>${c.nodes ?? 0}</b> nodes</span>
     <span><b>${c.edges ?? 0}</b> edges</span>
     <span><b>${c.llm_edges ?? 0}</b> inferred</span>`;
  $("hintExtra").textContent = `${DATA.nodes.length} structures on the map`;

  layout = computeLayout(DATA.nodes);
  renderIndex();
  render();
  refit();
  renderEmptyDetail();
  renderAbout();
})();
</script>
</body>
</html>
